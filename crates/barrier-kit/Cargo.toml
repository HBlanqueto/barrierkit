[package]
name = "barrier-kit"
description = "BarrierKit (≈ AppKit): the toolkit for the shell and Malaysia's own apps (glossary, ADR 0034)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
shell = []
tracy = ["dep:tracing-tracy"]
video = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video", "dep:gstreamer-allocators"]

[dependencies]
freya-core.workspace = true
freya-components.workspace = true
freya-animation.workspace = true
freya-engine.workspace = true
freya-skia-safe.workspace = true
freya-clipboard.workspace = true
torin.workspace = true
ragnarok.workspace = true
accesskit.workspace = true
accesskit_unix.workspace = true
thiserror.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
vow-design.workspace = true
vow-appearance.workspace = true
zeroize.workspace = true
infinity-protocol = { workspace = true, features = ["client"] }
sctk.workspace = true
wayland-protocols = { workspace = true }
wayland-protocols-plasma = { workspace = true, features = ["client"] }
zbus.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }
gstreamer-allocators = { workspace = true, optional = true }
ash.workspace = true
futures-util.workspace = true
futures-channel.workspace = true
async-io.workspace = true

[dev-dependencies]
freya-testing.workspace = true
png.workspace = true
