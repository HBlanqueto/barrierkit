[package]
name = "bk"
description = "BarrierKit (≈ AppKit): the toolkit for the shell and Malaysia's own apps (glossary, ADR 0034)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["a11y"]
a11y = ["dep:accesskit_unix"]
shell = []
tracy = ["dep:tracing-tracy"]

[dependencies]
freya-core.workspace = true
freya-components.workspace = true
freya-edit.workspace = true
freya-animation.workspace = true
freya-engine.workspace = true
freya-skia-safe.workspace = true
freya-clipboard.workspace = true
torin.workspace = true
ragnarok.workspace = true
accesskit.workspace = true
thiserror.workspace = true
serde.workspace = true
spellbook.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
ctdesign.workspace = true
ctappearance.workspace = true
zeroize.workspace = true
infinity-protocol = { workspace = true, features = ["client"] }
zbus.workspace = true
i18n-embed.workspace = true
i18n-embed-fl.workspace = true
rust-embed.workspace = true
futures-util.workspace = true
futures-channel.workspace = true
async-io.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
freya-engine = { workspace = true, features = ["vulkan"] }
accesskit_unix = { workspace = true, optional = true }
sctk.workspace = true
wayland-client = { workspace = true, features = ["system"] }
wayland-protocols.workspace = true
wayland-protocols-plasma = { workspace = true, features = ["client"] }
xkbcommon.workspace = true
ash.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
security-framework = "3"
objc2-user-notifications = "0.3"
calloop = "0.14"
dispatch2 = "0.3"
freya-engine = { workspace = true, features = ["metal"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"

[dev-dependencies]
freya-testing.workspace = true
png.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
wayland-server.workspace = true
infinity-protocol = { workspace = true, features = ["server"] }

[package.metadata.cargo-machete]
ignored = ["freya-skia-safe"]

