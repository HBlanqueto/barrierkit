[package]
name = "infinity-protocol"
description = "Private Infinity window-management protocol shared between Malaysia and BarrierKit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
client = ["dep:wayland-client", "dep:wayland-protocols-wlr", "wayland-protocols-wlr?/client"]
server = ["dep:wayland-server", "dep:wayland-protocols-wlr", "wayland-protocols-wlr?/server"]

[dependencies]
wayland-scanner.workspace = true
bitflags.workspace = true
wayland-backend.workspace = true
wayland-client = { workspace = true, optional = true }
wayland-server = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true, default-features = false }

[package.metadata.cargo-shear]
ignored = ["bitflags", "wayland-backend", "wayland-client", "wayland-server"]

[package.metadata.cargo-machete]
ignored = ["bitflags", "wayland-backend", "wayland-client", "wayland-server"]
