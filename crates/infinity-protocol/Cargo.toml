[package]
name = "infinity-protocol"
description = "The window protocol between apps and the compositor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
client = ["dep:wayland-client", "wayland-protocols-wlr?/client"]
server = ["dep:wayland-server", "wayland-protocols-wlr?/server"]
shell = ["dep:wayland-protocols-wlr"]

[dependencies]
wayland-scanner.workspace = true
bitflags.workspace = true
wayland-backend.workspace = true
wayland-client = { workspace = true, optional = true }
wayland-server = { workspace = true, optional = true }
wayland-protocols-wlr = { workspace = true, optional = true }
