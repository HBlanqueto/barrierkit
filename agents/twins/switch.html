<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Switch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=block">
<link rel="stylesheet" href="../tengen.css">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 24px;
    background: white;
    font-family: var(--bk-font-families-sans);
    font-size: calc(var(--bk-font-styles-body-size) * 1px);
    line-height: calc(var(--bk-font-styles-body-line-height) * 1px);
    color: var(--bk-ink-strong);
  }
  body { gap: calc(var(--bk-space-4) * 1px); }
  .bk-switch {
    position: relative;
    width: calc(var(--bk-switch-width) * 1px);
    height: calc(var(--bk-switch-height) * 1px);
    border-radius: calc(var(--bk-switch-height) * 1px);
    background: var(--bk-bg-control);
    box-shadow: inset 0 0 0 1px var(--bk-line);
  }
  .bk-switch.on { background: var(--bk-accent); box-shadow: none; }
  .bk-switch.on.disabled {
    background: color-mix(in srgb, var(--bk-accent) calc(var(--bk-switch-disabled-opacity) * 100%), transparent);
  }
  .bk-switch.disabled::after { opacity: var(--bk-switch-disabled-opacity); }
  .bk-switch::after {
    content: "";
    position: absolute;
    top: calc(var(--bk-switch-inset) * 1px);
    left: calc(var(--bk-switch-inset) * 1px);
    width: calc(var(--bk-switch-knob-width) * 1px);
    height: calc(var(--bk-switch-knob-height) * 1px);
    border-radius: calc(var(--bk-switch-knob-height) * 1px);
    background: var(--bk-switch-knob-color);
    box-shadow: 0 calc(var(--bk-shadow-slint-knob-offset-y) * 1px) calc(var(--bk-shadow-slint-knob-blur) * 1px) var(--bk-shadow-slint-knob-color);
  }
  .bk-switch.on::after { left: calc((var(--bk-switch-inset) + var(--bk-switch-travel)) * 1px); }
</style>
</head>
<body>
  <div class="bk-switch" data-bk="Switch Apagado" aria-label="Apagado"></div>
  <div class="bk-switch on" data-bk="Switch Encendido" aria-label="Encendido"></div>
  <div class="bk-switch on disabled" data-bk="Switch Inactivo" aria-label="Inactivo"></div>
</body>
</html>
