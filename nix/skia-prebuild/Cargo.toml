# Crate mínimo que solo existe para que nix/skia.nix compile Skia (vía
# freya-skia-bindings) una vez, en su propia derivación. freya-engine =0.4.3
# activa en Linux exactamente las features que usará BarrierKit; el preBuild
# del paquete las comprueba contra $out/features.txt.
[package]
name = "skia-prebuild"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
freya-engine = "=0.4.3"
# Pins the exact bindings version the Nix derivation and the guard expect.
freya-skia-safe = "=0.98.0"

[lib]
path = "src/lib.rs"

# Workspace propio: no es miembro del workspace de Yuki.
[workspace]
